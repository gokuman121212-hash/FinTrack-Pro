server:
  port: 8080

spring:
  application:
    name: fintrack-pro
  datasource:
    url: jdbc:h2:mem:fintrackdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

fintrack:
  jwt:
    secret: "CAFQFinTrackProSuperSecretKeyForHS256Signing2026EnterpriseSaaS!"
    expiration-ms: 86400000
  ai:
    # Soporta Ollama local (http://localhost:11434/v1/chat/completions) o OpenAI/Groq compatible
    endpoint: ${AI_ENDPOINT:http://localhost:11434/v1/chat/completions}
    api-key: ${AI_API_KEY:ollama}
    model: ${AI_MODEL:qwen2.5-coder:7b}