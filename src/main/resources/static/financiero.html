<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinTrack Pro · Dashboard Financiero</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #070b12; color: #e2e8f0; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .panel { background: linear-gradient(180deg, #0d1524 0%, #0a101b 100%); border: 1px solid #1b2a44; }
    .input-dark { background-color: #070c15; border: 1px solid #223554; color: #f1f5f9; }
  </style>
</head>
<body class="min-h-screen flex">
  <aside class="w-64 shrink-0 panel border-r border-slate-800/80 p-4 flex flex-col justify-between">
    <div>
      <div class="pb-4 border-b border-slate-800/80">
        <p class="text-sm font-semibold text-white">FinTrack Pro</p>
        <p class="text-[11px] text-blue-400 uppercase tracking-wider">Financiero</p>
      </div>
      <div class="mt-4 text-xs text-slate-400 space-y-1">
        <p class="text-white font-medium" id="finNombre">Financiero</p>
        <p class="truncate" id="finEmail">sin sesión</p>
      </div>
    </div>
    <button id="btnSalir" class="w-full py-2 rounded-lg bg-red-950/60 hover:bg-red-900/60 text-xs text-red-200 border border-red-800/50 cursor-pointer">Cerrar Sesión</button>
  </aside>

  <main class="flex-1 p-6 space-y-6">
    <header class="panel rounded-xl p-5">
      <h1 class="text-base font-semibold text-white">Panel Financiero</h1>
      <p class="text-xs text-slate-400">Registro de movimientos y clasificación automática de gastos por tramo</p>
    </header>
    <div id="banner" class="hidden px-4 py-3 rounded-lg text-sm border"></div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <section class="panel rounded-xl p-5">
        <h2 class="text-sm font-semibold text-white mb-3">Registrar Movimiento</h2>
        <form id="formTx" class="space-y-3">
          <select id="deptoId" required class="input-dark w-full rounded-lg px-3 py-2 text-sm"></select>
          <select id="tipo" class="input-dark w-full rounded-lg px-3 py-2 text-sm"><option value="EGRESO">EGRESO</option><option value="INGRESO">INGRESO</option></select>
          <input id="monto" type="number" step="0.01" min="0.01" required placeholder="Monto" class="input-dark w-full rounded-lg px-3 py-2 text-sm" />
          <p class="text-xs text-blue-300" id="tramoEst">Tramo: DIMINUTO</p>
          <input id="categoria" type="text" required placeholder="Categoría" class="input-dark w-full rounded-lg px-3 py-2 text-sm" />
          <input id="descripcion" type="text" placeholder="Descripción" class="input-dark w-full rounded-lg px-3 py-2 text-sm" />
          <button type="submit" class="w-full rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium py-2.5 cursor-pointer">Registrar</button>
        </form>
      </section>

      <section class="panel rounded-xl p-5 lg:col-span-2">
        <h2 class="text-sm font-semibold text-white mb-3">Movimientos</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse text-sm">
            <thead><tr class="border-b border-slate-800 text-xs text-slate-400 uppercase"><th class="py-2 px-3">ID</th><th class="py-2 px-3">Tipo</th><th class="py-2 px-3">Tramo</th><th class="py-2 px-3">Categoría</th><th class="py-2 px-3 text-right">Monto</th></tr></thead>
            <tbody id="tbody" class="divide-y divide-slate-800/60 text-slate-300"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <script>
    const TOKEN_KEY = "fintrack_token_financiero";
    const USER_KEY = "fintrack_user_financiero";
    const fmt = (n) => new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" }).format(Number(n || 0));
    const tramo = (m) => { const v = Math.abs(Number(m || 0)); return v < 15 ? "DIMINUTO" : v <= 100 ? "PEQUENO" : v <= 1000 ? "MEDIANO" : "GRANDE"; };
    const headers = () => { const h = { "Content-Type": "application/json" }; const t = localStorage.getItem(TOKEN_KEY); if (t) h["Authorization"] = `Bearer ${t}`; return h; };
    const banner = (m, err = false) => { const b = document.getElementById("banner"); b.className = `px-4 py-3 rounded-lg text-sm border ${err ? "bg-red-950/70 border-red-800 text-red-200" : "bg-blue-950/70 border-blue-800 text-blue-200"}`; b.textContent = m; };
    document.getElementById("monto").addEventListener("input", (e) => { document.getElementById("tramoEst").textContent = `Tramo: ${tramo(e.target.value)}`; });

    async function cargar() {
      const u = JSON.parse(localStorage.getItem(USER_KEY) || "null");
      if (u) { document.getElementById("finNombre").textContent = u.nombre || "Financiero"; document.getElementById("finEmail").textContent = u.email || ""; }
      const [dR, tR] = await Promise.all([fetch("/api/departamentos", { headers: headers() }), fetch("/api/transacciones", { headers: headers() })]);
      if (dR.ok) { const ds = await dR.json(); document.getElementById("deptoId").innerHTML = ds.map(d => `<option value="${d.id}">${d.nombre}</option>`).join(""); }
      if (tR.ok) {
        const ts = await tR.json();
        document.getElementById("tbody").innerHTML = ts.map(t => `<tr><td class="py-2 px-3 text-xs">#${t.id ?? "-"}</td><td class="py-2 px-3 text-xs">${t.tipo || "EGRESO"}</td><td class="py-2 px-3 text-xs text-blue-300">${tramo(t.monto)}</td><td class="py-2 px-3 text-xs">${t.categoria || "-"}</td><td class="py-2 px-3 text-xs text-right">${fmt(t.monto)}</td></tr>`).join("");
      } else { banner("Inicia sesión en /financiero/login para consultar y registrar movimientos.", true); }
    }

    document.getElementById("formTx").addEventListener("submit", async (e) => {
      e.preventDefault();
      const res = await fetch("/api/transacciones", { method: "POST", headers: headers(), body: JSON.stringify({ departamentoId: Number(document.getElementById("deptoId").value), tipo: document.getElementById("tipo").value, monto: Number(document.getElementById("monto").value), categoria: document.getElementById("categoria").value.trim(), descripcion: document.getElementById("descripcion").value.trim() }) });
      if (!res.ok) { banner((await res.text()) || `HTTP ${res.status}`, true); return; }
      e.target.reset(); banner("Movimiento registrado."); cargar();
    });

    document.getElementById("btnSalir").addEventListener("click", () => { localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(USER_KEY); window.location.href = "/financiero/login"; });
    cargar();
  </script>
</body>
</html>
