<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinTrack Pro - Usuario</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: radial-gradient(circle at 22% 35%, rgba(220, 38, 38, 0.25), transparent 45%),
                  radial-gradient(circle at 78% 65%, rgba(153, 27, 27, 0.22), transparent 50%),
                  #050608;
      color: #f8fafc;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    .glass-card {
      background: linear-gradient(160deg, rgba(30, 24, 28, 0.78) 0%, rgba(14, 15, 20, 0.90) 100%);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .cyber-visual {
      background: linear-gradient(135deg, rgba(127, 29, 29, 0.42) 0%, rgba(10, 12, 18, 0.94) 55%, rgba(24, 24, 32, 0.96) 100%);
      border: 1px solid rgba(248, 113, 113, 0.22);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-8">
  <div class="w-full max-w-6xl rounded-2xl overflow-hidden border border-white/10 bg-[#080a0f]/95 shadow-2xl">
    <header class="px-6 sm:px-10 py-4 flex items-center justify-between border-b border-white/10 text-xs">
      <span class="font-semibold text-red-400 tracking-wide">FinTrack Pro</span>
      <span class="px-3 py-1 rounded-full bg-red-950/60 border border-red-500/30 text-red-300 font-medium">USUARIO</span>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 min-h-[560px]">
      <div class="lg:col-span-7 cyber-visual p-8 sm:p-10 flex flex-col justify-between">
        <div class="text-[11px] uppercase tracking-widest text-red-300/80">
          Acceso Usuario - FinTrack Pro
        </div>
        <div class="my-auto py-8">
          <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-red-600/20 border border-red-500/40 text-red-200 text-xs mb-4">
            <span class="w-2 h-2 rounded-full bg-red-500"></span>
            <span>Autenticacion en Base de Datos</span>
          </div>
          <h2 class="text-3xl sm:text-4xl font-bold tracking-tight text-white leading-tight">
            Portal Usuario <br />
            <span class="text-red-400">FinTrack Pro</span>
          </h2>
          <p class="text-sm text-slate-300/80 mt-3 max-w-md">Registro directo de gastos operativos del dia clasificados por tramo de gasto.</p>
        </div>
        <div class="text-xs text-slate-400">
          Credenciales persistidas en base de datos - Destino: <span class="text-slate-200">/empleado/dashboard</span>
        </div>
      </div>

      <div class="lg:col-span-5 p-6 sm:p-10 flex items-center justify-center bg-[#090b10]">
        <div class="glass-card w-full max-w-md rounded-2xl p-7 sm:p-8 shadow-xl">
          <div class="flex items-center justify-between mb-5">
            <div>
              <h1 class="text-xl font-bold text-white">Hola!</h1>
              <p class="text-xs text-slate-300 mt-0.5" id="subForm">Inicia sesion - Usuario</p>
            </div>
            <button type="button" id="btnModo" class="text-xs px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-white font-medium cursor-pointer">
              Registrarse
            </button>
          </div>

          <div id="msgBox" class="hidden mb-4 px-3.5 py-2.5 rounded-lg text-xs border"></div>

          <form id="authForm" class="space-y-3.5">
            <div id="campoNombre" class="hidden">
              <input id="nombre" type="text" placeholder="Nombre completo"
                     class="w-full rounded-lg bg-slate-100 text-slate-900 placeholder-slate-500 px-4 py-3 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-red-500" />
            </div>
            <div>
              <input id="email" type="email" required placeholder="Correo electronico"
                     class="w-full rounded-lg bg-slate-100 text-slate-900 placeholder-slate-500 px-4 py-3 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-red-500" />
            </div>
            <div class="relative">
              <input id="password" type="password" required placeholder="Contrasena"
                     class="w-full rounded-lg bg-slate-100 text-slate-900 placeholder-slate-500 px-4 py-3 pr-16 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-red-500" />
              <button type="button" id="togglePass" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-600 hover:text-slate-950 text-xs font-semibold px-1.5 py-1 cursor-pointer">
                VER
              </button>
            </div>

            <button type="submit" id="btnSubmit"
                    class="w-full rounded-lg bg-white hover:bg-slate-200 text-slate-950 font-semibold py-3 text-sm transition cursor-pointer">
              Iniciar Sesion
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    const ROL = "EMPLEADO";
    const DESTINO = "/empleado/dashboard";
    const TOKEN_KEY = "fintrack_token_empleado";
    const USER_KEY = "fintrack_user_empleado";
    let modoRegistro = false;

    const passInput = document.getElementById("password");
    const nombreInput = document.getElementById("nombre");
    const emailInput = document.getElementById("email");
    const toggleBtn = document.getElementById("togglePass");

    toggleBtn.addEventListener("click", () => {
      const p = passInput.type === "password";
      passInput.type = p ? "text" : "password";
      toggleBtn.textContent = p ? "OCULTAR" : "VER";
    });

    const showMsg = (txt, esError = true) => {
      const b = document.getElementById("msgBox");
      b.className = "mb-4 px-3.5 py-2.5 rounded-lg text-xs border " + (esError ? "bg-red-950/80 border-red-500/40 text-red-200" : "bg-emerald-950/80 border-emerald-500/40 text-emerald-200");
      b.textContent = txt;
    };

    document.getElementById("btnModo").addEventListener("click", () => {
      modoRegistro = !modoRegistro;
      document.getElementById("campoNombre").classList.toggle("hidden", !modoRegistro);
      nombreInput.required = modoRegistro;
      document.getElementById("btnSubmit").textContent = modoRegistro ? "Crear Cuenta" : "Iniciar Sesion";
      document.getElementById("btnModo").textContent = modoRegistro ? "Ya tengo cuenta" : "Registrarse";
      document.getElementById("subForm").textContent = modoRegistro ? "Registro nuevo - Usuario" : "Inicia sesion - Usuario";
    });

    document.getElementById("authForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      const password = passInput.value;
      const nombre = nombreInput.value.trim();
      const url = modoRegistro ? "/api/auth/cuenta/register" : "/api/auth/cuenta/login";
      const payload = modoRegistro ? { email, password, nombre, rol: ROL } : { email, password, rol: ROL };
      try {
        const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) { showMsg(data.error || "Error de autenticacion (HTTP " + res.status + ")"); return; }
        if (data.token) localStorage.setItem(TOKEN_KEY, data.token);
        localStorage.setItem(USER_KEY, JSON.stringify({ id: data.id, email: data.email, nombre: data.nombre, rol: data.rol, proveedor: data.proveedor }));
        window.location.href = DESTINO;
      } catch (err) { showMsg("Error de conexion: " + err.message); }
    });
  </script>
</body>
</html>
